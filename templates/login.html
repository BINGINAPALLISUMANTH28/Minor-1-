<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Smart Classroom Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <main class="main-wrapper" style="max-width: 460px; margin: 8vh auto;">
        <div class="panel" style="padding: 28px;">
            <h1 class="page-title">Sign in</h1>
            <p class="page-subtitle" style="margin-bottom: 22px;">Use your assigned faculty or administrator account.</p>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <p id="login-error" role="alert" style="color: #b91c1c;"></p>
                <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
        </div>
    </main>
    <script>
    const nextUrl = {{ next_url|tojson }};
    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        const result = await response.json();
        if (result.success) window.location.assign(nextUrl);
        else document.getElementById('login-error').textContent = result.error || 'Sign in failed.';
    });
    </script>
</body>
</html>
